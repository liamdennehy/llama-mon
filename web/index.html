<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llama-mon Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0d1117; --bg-card: #161b22; --bg-hover: #21262d;
  --bg-input: #0d1117;
  --border: #30363d; --text: #c9d1d9; --text-muted: #8b949e;
  --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
}
[data-theme="light"] {
  --bg: #f6f8fa; --bg-card: #ffffff; --bg-hover: #f0f0f0;
  --bg-input: #f6f8fa;
  --border: #d0d7de; --text: #1f2328; --text-muted: #656d76;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
       background: var(--bg); color: var(--text); padding: 1rem; }
h1 { font-size: 1.5rem; margin-bottom: 1rem; }
header { display: flex; justify-content: space-between; align-items: center;
         margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
header h1 { margin-bottom: 0; }
.controls { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
select, button { background: var(--bg-card); color: var(--text); border: 1px solid var(--border);
                 padding: 0.3rem 0.65rem; border-radius: 6px; cursor: pointer; font-size: 0.82rem; }
select:focus, button:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button:hover { background: var(--bg-hover); }
button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
.card h3 { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.card .value { font-size: 1.65rem; font-weight: 700; margin-top: 0.25rem; }
.card .value.accent { color: var(--accent); }
.card .value.green { color: var(--green); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
.charts .bubble-card { grid-column: 1 / -1; }
.chart-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem; }
.chart-card h3 { font-size: 0.82rem; margin-bottom: 0.6rem; }
canvas { max-height: 220px; width: 100% !important; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
th, td { padding: 0.45rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--text-muted); font-weight: 600; position: sticky; top: 0; background: var(--bg-card); z-index: 1; }
tr:hover td { background: var(--bg-hover); }
.scroll { max-height: 300px; overflow-y: auto; }
.status-loaded { color: var(--green); font-weight: 600; }
.status-unloaded { color: var(--red); }
#status { font-size: 0.78rem; color: var(--text-muted); min-width: 180px; }
#status.error { color: var(--red); }
#status.ok { color: var(--green); }
.error-banner { background: #3d1f1f; border: 1px solid var(--red); color: #f85149; padding: 0.75rem;
               border-radius: 8px; margin-bottom: 1rem; text-align: center; }
.loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3);
                   display: flex; align-items: center; justify-content: center; z-index: 100; }
.loading-overlay .spinner { border: 3px solid var(--border); border-top-color: var(--accent);
                             border-radius: 50%; width: 36px; height: 36px; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media print {
  body { background: #fff !important; color: #000 !important; padding: 0.5rem; }
  .card { border: 1px solid #ccc; break-inside: avoid; }
  .charts { display: none !important; }
  .controls { display: none !important; }
  .scroll { max-height: none !important; overflow: visible !important; }
  table { font-size: 0.7rem; }
  th { background: #eee !important; }
}
</style>
</head>
<body>
<header>
  <h1>llama-mon</h1>
  <div class="controls">
    <span id="status">Initializing...</span>
    <button id="autoRefreshBtn" class="active" title="Toggle auto-refresh">●</button>
    <select id="timeRange" aria-label="Time range">
      <option value="1h">1h</option>
      <option value="6h">6h</option>
      <option value="24h" selected>24h</option>
      <option value="7d">7d</option>
    </select>
    <select id="modelFilter" aria-label="Model filter">
      <option value="">All Models</option>
    </select>
    <button id="refreshBtn" title="Refresh now">↻ Refresh</button>
    <button id="exportBtn" title="Export scrapes to CSV">↓ CSV</button>
    <button id="themeBtn" title="Toggle theme">🌙</button>
  </div>
</header>

<div id="errorBanner" class="error-banner" style="display:none;"></div>

<div class="grid">
  <div class="card"><h3>Total Scrapes</h3><div class="value accent" id="scrapes">—</div></div>
  <div class="card"><h3>Total Tasks</h3><div class="value green" id="tasks">—</div></div>
  <div class="card"><h3>Model Loads</h3><div class="value" id="loads">—</div></div>
  <div class="card"><h3>Reloads</h3><div class="value" id="reloads">—</div></div>
</div>

<div class="charts">
  <div class="chart-card"><h3>Tasks Completed</h3><canvas id="chartScrapes"></canvas></div>
  <div class="chart-card"><h3>Gen TPS</h3><canvas id="chartTps"></canvas></div>
  <div class="chart-card"><h3>Gen Latency (ms/token)</h3><canvas id="chartLatency"></canvas></div>
  <div class="chart-card"><h3>Memory (GB)</h3><canvas id="chartMemory"></canvas></div>
  <div class="chart-card bubble-card">
    <h3>
      Throughput vs Context Length
      <select id="tpsMetric" style="font-size:0.75rem;padding:0.15rem 0.35rem;margin-left:0.5rem;background:var(--bg-input);">
        <option value="gen_tps">Gen TPS</option>
        <option value="prompt_tps">Prompt TPS</option>
      </select>
    </h3>
    <canvas id="chartBubble"></canvas>
  </div>
</div>

<div class="card" style="margin-bottom:1rem;">
  <h3 style="margin-bottom:0.5rem;">Models</h3>
  <div class="scroll"><table><thead><tr>
    <th>Name</th><th>Status</th><th>Created</th><th>Scrapes</th><th>Context</th>
  </tr></thead><tbody id="modelsBody"></tbody></table></div>
</div>

<div class="card">
  <h3 style="margin-bottom:0.5rem;">Recent Tasks <span id="taskCount" style="font-weight:400;font-size:0.75rem;color:var(--text-muted);"></span></h3>
  <div class="scroll"><table><thead><tr>
    <th>ID</th><th>Model</th><th>Slot</th><th>Gen</th><th>Gen TPS</th>
    <th>Gen ms/t</th><th>Prompt</th><th>Prompt TPS</th><th>Captured</th>
  </tr></thead><tbody id="tasksBody"></tbody></table></div>
</div>

<script>
const charts = {};
let summary = null, models = [], scrapes = [], tasks = [];
let autoRefresh = true;
let refreshTimer = null;

// ── Theme ────────────────────────────────────────────────────
function initTheme() {
  const saved = localStorage.getItem('llama-mon-theme');
  const isLight = saved === 'light';
  document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
  document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const next = isLight ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('llama-mon-theme', next);
  document.getElementById('themeBtn').textContent = isLight ? '🌙' : '☀️';
  // Re-render charts with new colors
  renderCharts();
});
initTheme();

// ── Data fetching ────────────────────────────────────────────
function showError(msg) {
  const banner = document.getElementById('errorBanner');
  banner.textContent = msg;
  banner.style.display = 'block';
  document.getElementById('status').className = 'error';
}
function hideError() {
  document.getElementById('errorBanner').style.display = 'none';
  document.getElementById('status').className = 'ok';
}

async function fetchData() {
  const range = document.getElementById('timeRange').value;
  const model = document.getElementById('modelFilter').value;
  // Map frontend values (1h, 6h, 24h, 7d) to Rust enum variants (H1, H6, H24, D7)
  const rangeMap = { '1h': 'H1', '6h': 'H6', '24h': 'H24', '7d': 'D7' };
  const params = new URLSearchParams({ time_range: rangeMap[range] || 'H24', limit: 200 });
  if (model) params.set('model', model);

  try {
    const [sRes, mRes, scRes, tRes] = await Promise.all([
      fetch('/api/stats/summary'),
      fetch('/api/models'),
      fetch('/api/scrapes?' + params),
      fetch('/api/tasks?' + params),
    ]);
    if (!sRes.ok || !mRes.ok || !scRes.ok || !tRes.ok) throw new Error('One or more API calls failed');
    [summary, models, scrapes, tasks] = await Promise.all([
      sRes.json(), mRes.json(), scRes.json(), tRes.json(),
    ]);
    hideError();
    document.getElementById('status').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    showError('Connection failed: ' + e.message);
    return;
  }
  render();
}

// ── Rendering ────────────────────────────────────────────────
function render() {
  if (!summary) return;
  document.getElementById('scrapes').textContent = summary.total_scrapes.toLocaleString();
  document.getElementById('tasks').textContent = summary.total_tasks.toLocaleString();
  document.getElementById('loads').textContent = summary.total_model_loads.toLocaleString();
  document.getElementById('reloads').textContent = summary.total_reloads.toLocaleString();

  const mb = document.getElementById('modelsBody');
  mb.innerHTML = models.map(m =>
    `<tr><td>${esc(m.model_name)}</td>` +
    `<td class="${m.status==='loaded'?'status-loaded':'status-unloaded'}">${m.status}</td>` +
    `<td>${new Date(m.created*1000).toLocaleString()}</td>` +
    `<td>${m.scrape_count}</td>` +
    `<td>${m.ctx_size ? m.ctx_size.toLocaleString() : '—'}</td></tr>`
  ).join('');

  const tb = document.getElementById('tasksBody');
  document.getElementById('taskCount').textContent = `(${tasks.length} shown)`;
  tb.innerHTML = tasks.slice(0, 50).map(t =>
    `<tr><td>${t.task_id}</td><td>${esc(t.model_name)}</td><td>${t.slot_id}</td>` +
    `<td>${t.n_gen}</td><td>${t.gen_tps.toFixed(1)}</td>` +
    `<td>${t.gen_per_token_ms.toFixed(1)}</td><td>${t.n_prompt_cached+t.n_prompt_processed}</td>` +
    `<td>${t.prompt_tps.toFixed(1)}</td>` +
    `<td>${new Date(t.captured_at*1000).toLocaleString()}</td></tr>`
  ).join('');

  renderCharts();
}

// ── Charts ───────────────────────────────────────────────────
function renderCharts() {
  const labels = scrapes.map(s => new Date(s.scraped_at*1000).toLocaleTimeString());
  const theme = document.documentElement.getAttribute('data-theme');
  const gridColor = theme === 'light' ? '#e8e8e8' : '#30363d';
  const tickColor = theme === 'light' ? '#555' : '#8b949e';
  const fillOpacity = theme === 'light' ? '0.08' : '0.22';

  const chartOpts = {
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: tickColor, maxTicksLimit: 10 }, grid: { color: gridColor } },
      y: { ticks: { color: tickColor }, grid: { color: gridColor } }
    }
  };

  // Tasks completed (cumulative)
  if (charts.chartScrapes) charts.chartScrapes.destroy();
  charts.chartScrapes = new Chart(document.getElementById('chartScrapes'), {
    type: 'line',
    data: { labels, datasets: [{ label: 'Completed', data: scrapes.map(s => s.tasks_completed),
              borderColor: '#58a6ff', fill: true, backgroundColor: '#58a6ff'+fillOpacity,
              tension: 0.3, pointRadius: 1 }] },
    options: chartOpts
  });

  // Gen TPS
  const tasksSlice = tasks.slice(0, 100);
  if (charts.chartTps) charts.chartTps.destroy();
  charts.chartTps = new Chart(document.getElementById('chartTps'), {
    type: 'scatter',
    data: { datasets: [{ label: 'Gen TPS', data: labels.slice(0, tasksSlice.length).map((l,i) => ({x:l, y:tasksSlice[i].gen_tps})),
              backgroundColor: '#3fb950', pointRadius: 1.5 }] },
    options: chartOpts
  });

  // Latency
  if (charts.chartLatency) charts.chartLatency.destroy();
  charts.chartLatency = new Chart(document.getElementById('chartLatency'), {
    type: 'scatter',
    data: { datasets: [{ label: 'Gen ms/token', data: labels.slice(0, tasksSlice.length).map((l,i) => ({x:l, y:tasksSlice[i].gen_per_token_ms})),
              backgroundColor: '#d29922', pointRadius: 1.5 }] },
    options: chartOpts
  });

  // Memory
  if (charts.chartMemory) charts.chartMemory.destroy();
  charts.chartMemory = new Chart(document.getElementById('chartMemory'), {
    type: 'line',
    data: { labels, datasets: [{ label: 'Memory', data: scrapes.map(s => +(((s.memory_context_bytes||0)+(s.memory_model_bytes||0))/1e9).toFixed(2)),
              borderColor: '#f85149', fill: true, backgroundColor: '#f85149'+fillOpacity,
              tension: 0.3, pointRadius: 1 }] },
    options: chartOpts
  });

  // Throughput vs Context Length — bubble chart
  renderBubbleChart(gridColor, tickColor);
}

function renderBubbleChart(gridColor, tickColor) {
  const metric = document.getElementById('tpsMetric')?.value || 'gen_tps';
  const limit = 500;
  const data = tasks.slice(0, limit).map(t => {
    const ctxLen = (t.n_prompt_cached || 0) + (t.n_prompt_processed || 0);
    const tps = t[metric] || 0;
    const r = ctxLen > 0 ? Math.max(3, Math.min(20, Math.sqrt(t.n_gen || 1) * 0.7)) : 0;
    return { x: ctxLen, y: tps, r };
  }).filter(d => d.x > 0 && d.r > 0);

  const yLabel = metric === 'gen_tps' ? 'Gen TPS' : 'Prompt TPS';
  const color = metric === 'gen_tps' ? '#3fb950' : '#58a6ff';

  if (charts.chartBubble) charts.chartBubble.destroy();
  charts.chartBubble = new Chart(document.getElementById('chartBubble'), {
    type: 'bubble',
    data: {
      datasets: [{
        label: yLabel,
        data,
        backgroundColor: color + '99',
        borderColor: color,
        borderWidth: 1,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const d = ctx.raw;
              return `${yLabel}: ${d.y.toFixed(1)}  Tokens: ${Math.round(d.r*d.r/0.49)}`;
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'Context Length (tokens)', color: tickColor },
          ticks: { color: tickColor },
          grid: { color: gridColor },
          min: 0,
        },
        y: {
          title: { display: true, text: yLabel + ' (tokens/sec)', color: tickColor },
          ticks: { color: tickColor },
          grid: { color: gridColor },
          min: 0,
        }
      }
    }
  });
}

// ── CSV Export ───────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  if (scrapes.length === 0) { showError('No scrape data to export'); return; }
  const headers = ['timestamp','scraped_at','model_name','tasks_completed','tasks_duration_s',
    'context_max','prompt_tokens_total','prediction_tokens_total','decode_total',
    'memory_context_bytes','memory_model_bytes'];
  const rows = scrapes.map(s => headers.map(h => {
    if (h === 'timestamp') return new Date(s.scraped_at * 1000).toISOString();
    return s[h] ?? '';
  }).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `llama-mon-scrapes-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
});

// ── Controls ─────────────────────────────────────────────────
document.getElementById('refreshBtn').addEventListener('click', () => { fetchData(); });

document.getElementById('autoRefreshBtn').addEventListener('click', function() {
  autoRefresh = !autoRefresh;
  this.classList.toggle('active', autoRefresh);
  this.textContent = autoRefresh ? '●' : '○';
  if (autoRefresh) { startAutoRefresh(); } else { stopAutoRefresh(); }
});

function startAutoRefresh() { stopAutoRefresh(); refreshTimer = setInterval(fetchData, 30000); }
function stopAutoRefresh() { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }

document.getElementById('timeRange').addEventListener('change', fetchData);
document.getElementById('modelFilter').addEventListener('change', fetchData);
document.getElementById('tpsMetric')?.addEventListener('change', () => renderCharts());

// ── Init ─────────────────────────────────────────────────────
async function initModelFilter() {
  try {
    const r = await fetch('/api/models');
    const d = await r.json();
    const sel = document.getElementById('modelFilter');
    const names = [...new Set(d.map(m => m.model_name))];
    names.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; sel.appendChild(o); });
  } catch { /* models not available yet */ }
}

initModelFilter().then(fetchData);
startAutoRefresh();
</script>
</body>
</html>
