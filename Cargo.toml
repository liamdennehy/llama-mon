[package]
name = "llama-mon"
version = "0.4.0"
edition = "2024"

[[bin]]
name = "llama-mon"
path = "src/main.rs"

[features]
default = []
dev = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"], default-features = true }
duration-str = { version = "0.12", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }
futures = "0.3"
signal-hook = "0.3"
dirs = "5"
humantime = "2"
percent-encoding = "2"
url = "2"
dotenvy = "0.15"
axum = { version = "0.8", features = ["macros"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
